<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Nominal, ordinal, interval, and ratio measurement scales</title>
  <desc id="description">The four measurement scales progress from grouping to summary and from discrete to continuous.</desc>
  <defs>
    <marker id="arrow-start" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <path d="M 12 0 L 0 6 L 12 12 Z" fill="#c0504d"/>
    </marker>
    <marker id="arrow-end" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#c0504d"/>
    </marker>
    <style>
      .scale { font-family: Arial, Helvetica, sans-serif; font-size: 58px; font-weight: 700; fill: #111111; }
      .axis { font-family: Arial, Helvetica, sans-serif; font-size: 43px; font-style: italic; fill: #a61c1c; }
      .arrow { stroke: #c0504d; stroke-width: 8; }
    </style>
  </defs>
  <text class="scale" x="75" y="125">Nominal Scale</text>
  <text class="scale" x="75" y="285">Ordinal Scale</text>
  <text class="scale" x="75" y="445">Interval Scale</text>
  <text class="scale" x="75" y="605">Ratio Scale</text>

  <line class="arrow" x1="640" y1="180" x2="640" y2="525" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text class="axis" x="640" y="120" text-anchor="middle">Discrete</text>
  <text class="axis" x="640" y="610" text-anchor="middle">Continuous</text>

  <line class="arrow" x1="980" y1="180" x2="980" y2="525" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text class="axis" x="980" y="120" text-anchor="middle">Grouping</text>
  <text class="axis" x="980" y="610" text-anchor="middle">Summary</text>
</svg>
