
project:
  type: website
  output-dir: _site
  post-render:
    - scripts/render_section_syllabi.R
  render:
    # Public course-site sources only. Canvas-native content, data publishing
    # documentation, development notes, instructor versions, and standalone
    # assignment-repository sources must not be discovered automatically.
    - index.qmd
    - datasets/index.qmd
    - datasets/chicago-traffic.qmd
    - datasets/airline.qmd
    - datasets/nfl.qmd
    - datasets/olist.qmd
    - datasets/health.qmd
    - syllabus/syllabus.qmd
    - week01/week_01.qmd
    - week01/Homework_01.qmd
  resources:
    - shared/styles/accesibility.css
    # Shared lab downloads are published once with the course website and used
    # by every Canvas section.
    - week01/lab-prep/data/olist_orders_sample.csv
    - week02/labs/data/Lab_02_NFL_Files.zip
    - week03/lab-prep/Lab_03_Chart_Practice.xlsx
    - week03/labs/data/chicago_traffic_crashes_sample.csv
    # Homework 1 fallback downloads. These are the same deterministic samples
    # distributed inside the Posit Cloud assignment project.
    - shared/data/early-homework-v1/traffic_chicago_2024.csv
    - shared/data/early-homework-v1/airline_midwest_2024.csv
    - shared/data/early-homework-v1/olist_southeast_2017.csv
    - shared/data/early-homework-v1/nfl_plays_2024.csv
    - shared/data/early-homework-v1/health_wisconsin_appointments_2023_2025.csv
  preview:
    browser: true

website:
  title: "ECO 230"
  navbar:
    left:
      - text: "Home"
        file: index.qmd
      - text: "Syllabus"
        menu:
          - text: "Section 4"
            href: syllabus_section_4.html
          - text: "Section 11"
            href: syllabus_section_11.html
          - text: "Section 12"
            href: syllabus_section_12.html
      - text: "Datasets"
        menu:
          - text: "Dataset Catalog"
            file: datasets/index.qmd
          - text: "Chicago Traffic Crashes"
            file: datasets/chicago-traffic.qmd
          - text: "U.S. Airline Marketplace"
            file: datasets/airline.qmd
          - text: "NFL Games and Plays"
            file: datasets/nfl.qmd
          - text: "Olist Marketplace"
            file: datasets/olist.qmd
          - text: "Synthetic Health Records"
            file: datasets/health.qmd
      - text: "Week 1 Slides"
        file: week01/week_01.qmd
      - text: "Homework 1"
        file: week01/Homework_01.qmd
            

format:
  html:
    toc: false            # default for normal pages (we'll turn on ToC in syllabus.qmd only)
    number-sections: false
    css: shared/styles/accesibility.css

execute:
  echo: false
  warning: false

editor: visual
