schema_version: 1
status: draft
key: open-topic-case-executive-summary
title: Project 2 - Research Proposal
points_possible: 100.0
free_form_criterion_comments: false
hide_score_total: false
criteria:
- key: week-13-informal-meeting-1
  description: Week 13 Informal Topic Meeting
  long_description: In-class topic discussion, worth 10 points.
  points: 10.0
  use_range: true
  ratings:
  - key: professional-quality
    description: Professional Quality
    long_description: Team brings a proposed topic, explains the problem or opportunity and decision maker, and describes a focused question and a workable direction for the proposed study.
    points: 10.0
  - key: high-quality-with-minor-issues
    description: Meets Expectations
    long_description: Team brings a workable topic, but the problem, decision maker, question, or proposed approach needs clarification.
    points: 8.0
  - key: low-quality-with-major-issues
    description: Needs Revision
    long_description: Team has a topic but cannot yet explain the problem, question, or how it could be studied.
    points: 5.0
  - key: no-marks
    description: Missing
    long_description: Team does not participate or does not bring a proposed topic.
    points: 0.0
- key: week-14-informal-presentation-2
  description: Week 14 Research Proposal Pitch
  long_description: In-class pitch to a small set of teams, worth 10 points.
  points: 10.0
  use_range: true
  ratings:
  - key: full-marks
    description: Professional Quality
    long_description: Pitch explains the problem, question, proposed study design, reasons for the design choices, and main risks. Team responds to questions about the proposed work.
    points: 10.0
  - key: high-quality-with-minor-issues
    description: Meets Expectations
    long_description: Pitch explains the proposal, but a design choice, its rationale, or an important risk remains unclear.
    points: 8.0
  - key: low-quality-with-major-issues
    description: Needs Revision
    long_description: Pitch omits major parts of the proposed study or is difficult to follow.
    points: 5.0
  - key: no-marks
    description: Missing
    long_description: Team does not present a research proposal.
    points: 0.0
- key: week-14-red-team-critique-3
  description: Week 14 Red Team Critique Exercise
  long_description: In-class critique exercise, worth 10 points within Project 2.
  points: 10.0
  use_range: true
  ratings:
  - key: professional-quality
    description: Professional Quality
    long_description: Team identifies specific sampling, measurement, design, ethical, or interpretation concerns in another proposal and discusses changes that could improve it.
    points: 10.0
  - key: high-quality-with-minor-issues
    description: Meets Expectations
    long_description: Team identifies relevant concerns, but the explanation or suggested changes need more detail.
    points: 8.0
  - key: low-quality-with-major-issues
    description: Needs Revision
    long_description: Feedback is too general or incomplete to help the presenting team revise its proposal.
    points: 5.0
  - key: no-marks
    description: Missing
    long_description: Team does not participate in the critique exercise.
    points: 0.0
- key: written-proposal-1-4
  description: Written Proposal - Problem or Opportunity
  long_description: One criterion within the same 70-point Written Research Proposal.
  points: 15.0
  use_range: true
  ratings:
  - key: professional-quality
    description: Professional Quality
    long_description: Paper identifies the problem or opportunity, explains why it matters, and names the decision maker and the decision the proposed study would inform.
    points: 15.0
  - key: high-quality-with-minor-issues
    description: Meets Expectations
    long_description: Paper identifies the problem or opportunity but needs a clearer explanation of its importance, decision maker, or intended use.
    points: 12.0
  - key: low-quality-with-major-issues
    description: Needs Revision
    long_description: Problem or opportunity is vague, and the paper does not explain how the proposed study would inform a decision.
    points: 8.0
  - key: no-marks
    description: Missing
    long_description: Problem or opportunity is missing.
    points: 0.0
- key: written-proposal-2-5
  description: Written Proposal - Research Question and Direction
  long_description: One criterion within the same 70-point Written Research Proposal.
  points: 15.0
  use_range: true
  ratings:
  - key: professional-quality
    description: Professional Quality
    long_description: Paper states a focused research question, explains its scope, and connects it to the decision. Any objectives or tentative hypotheses clarify the proposed work.
    points: 15.0
  - key: high-quality-with-minor-issues
    description: Meets Expectations
    long_description: Question is workable but needs a clearer scope or connection to the decision and study design.
    points: 12.0
  - key: low-quality-with-major-issues
    description: Needs Revision
    long_description: Question is unclear, too broad, or poorly connected to the proposed study.
    points: 8.0
  - key: no-marks
    description: Missing
    long_description: Research question is missing.
    points: 0.0
- key: written-proposal-3-6
  description: Written Proposal - Study Design and Measures
  long_description: One criterion within the same 70-point Written Research Proposal. Evaluate the proposed work, not completed research.
  points: 20.0
  use_range: true
  ratings:
  - key: professional-quality
    description: Professional Quality
    long_description: Paper explains and justifies the proposed method, population, sample selection, main concepts and measures, and data collection process. The reader can understand how the study would be conducted.
    points: 20.0
  - key: high-quality-with-minor-issues
    description: Meets Expectations
    long_description: Design fits the question, but the method, sampling, measures, or planned collection process needs more detail.
    points: 16.0
  - key: low-quality-with-major-issues
    description: Needs Revision
    long_description: Design is incomplete or does not explain how the proposed method and measures would answer the question.
    points: 10.0
  - key: no-marks
    description: Missing
    long_description: Proposed study design and measures are missing.
    points: 0.0
- key: written-proposal-4-7
  description: Written Proposal - Sampling, Measurement, Conclusions, Risks, and Ethics
  long_description: One criterion within the same 70-point Written Research Proposal. No data collection, study implementation, or analysis is required.
  points: 20.0
  use_range: true
  ratings:
  - key: professional-quality
    description: Professional Quality
    long_description: Paper explains representation, bias, measurement concerns, and limits on generalization or causal claims. It identifies specific risks and ethical concerns, explains how they would be addressed, and acknowledges remaining limitations.
    points: 20.0
  - key: high-quality-with-minor-issues
    description: Meets Expectations
    long_description: Paper addresses the quality of the proposed evidence, risks, and ethics, but overlooks an important concern or needs to explain its effect on conclusions.
    points: 16.0
  - key: low-quality-with-major-issues
    description: Needs Revision
    long_description: Discussion gives general cautions with little connection to this study or omits major sampling, interpretation, or ethical concerns.
    points: 10.0
  - key: no-marks
    description: Missing
    long_description: Discussion of evidence quality, risks, limitations, and ethics is missing.
    points: 0.0
