schema_version: 1
status: approved
key: homework-3
title: Homework 3
points_possible: 100.0
free_form_criterion_comments: false
hide_score_total: false
criteria:
- key: graph-1-1
  description: Graph 1
  long_description: 'Create a graph that tells one of the following story types from the lecture/readings: Nominal Comparison or Ranking. Embed this visual in the submitted Word/PDF document and place its 3-5 sentence explanation directly below it.'
  points: 20.0
  use_range: true
  ratings:
  - key: professional-quality
    description: Professional Quality
    long_description: 'Chart type clearly fits a comparison frame (nominal or ranking).

      Bars, axes, labels, and scales are clear and perceptually honest.

      Category ordering supports the story (e.g., sorted for ranking).

      Visual is understandable without additional explanation.

      Filters, grouping, and units are appropriate and explicitly considered.

      Design reflects lecture principles: minimal clutter, purposeful color, readable scale.'
    points: 20.0
  - key: high-quality-with-minor-issues
    description: High Quality with Minor Issues
    long_description: 'Chart generally fits the comparison frame, but clarity could be improved (e.g., axis labels, sorting, units).

      Visual mostly supports the story but relies somewhat on the written explanation.

      Minor design or formatting issues reduce perceptual clarity.'
    points: 15.0
  - key: medium-quality-with-significant-issues
    description: Medium Quality with Significant Issues
    long_description: 'Chart type does not effectively support comparison (e.g., unsorted ranking bars).

      Missing or unclear axes, units, or labels.

      Viewer cannot interpret the story without reading the summary.

      Filters/measures appear incorrect or incomplete.'
    points: 10.0
  - key: low-quality-with-major-issues
    description: Low Quality with Major Issues
    long_description: 'Chart cannot be interpreted reliably as comparison or ranking.

      Major elements missing (units, labels, scale, categories).

      Does not relate to the writeup or assignment goals.'
    points: 5.0
  - key: no-marks
    description: No Marks
    long_description: Graph is not included.
    points: 0.0
- key: graph-2-2
  description: Graph 2
  long_description: 'Create a graph that tells one of the following story types from the lecture/readings: Part to Whole, Time Series or Deviation. Embed this visual in the submitted Word/PDF document and place its 3-5 sentence explanation directly below it.'
  points: 20.0
  use_range: true
  ratings:
  - key: professional-quality
    description: Professional Quality
    long_description: 'Chart type matches chosen frame (100% bar, honest time series, deviation with zero baseline).

      Visual is perceptually clean, with correct denominators or benchmark labeling.

      Viewer can understand the story directly from the graph.

      Filters, periods, and categories are appropriate and documented.

      Applies design principles: honest baselines, thoughtful color, minimal distractions.'
    points: 20.0
  - key: high-quality-with-minor-issues
    description: High Quality with Minor Issues
    long_description: 'Frame mostly appropriate, with small issues (e.g., unclear normalization, unlabeled benchmark, insufficient date labeling).

      Visual is mostly clear but requires the summary to fully interpret.

      Minor design issues (scale, color use, clutter).'
    points: 15.0
  - key: medium-quality-with-significant-issues
    description: Medium Quality with Significant Issues
    long_description: 'Chart does not match chosen frame (e.g., part‑to‑whole not summing to 100%, time series without meaningful scale).

      Important denominators or benchmarks missing.

      Viewer cannot interpret meaning without summary.'
    points: 10.0
  - key: low-quality-with-major-issues
    description: Low Quality with Major Issues
    long_description: 'Incompatible chart (e.g., a pie chart when not appropriate; no zero line in a deviation plot).

      Missing critical context, labels, or units.

      Story cannot be determined.'
    points: 5.0
  - key: no-marks
    description: No Marks
    long_description: Graph is not included.
    points: 0.0
- key: graph-3-3
  description: Graph 3
  long_description: 'Create a graph that tells one of the following story types from the lecture/readings: Frequency Distribution or Correlation. Embed this visual in the submitted Word/PDF document and place its 3-5 sentence explanation directly below it.'
  points: 20.0
  use_range: true
  ratings:
  - key: professional-quality
    description: Professional Quality
    long_description: 'Chart type correctly matches distribution or correlation frame.

      Units, axes, binning (for distributions), or regression line (if used) are appropriate and justified.

      Visual communicates shape/spread/relationship clearly without explanation.

      Proper handling of outliers, overplotting (alpha), or bin width choices.

      Filters, variables, and measures are appropriate.'
    points: 20.0
  - key: high-quality-with-minor-issues
    description: High Quality with Minor Issues
    long_description: 'Chart generally fits the frame but minor improvements needed (e.g., better bin width, clearer axes, trend line not labeled).

      Viewer needs the summary for full understanding.

      Minor perceptual issues present.'
    points: 15.0
  - key: medium-quality-with-significant-issues
    description: Medium Quality with Significant Issues
    long_description: 'Poor binning, misleading use of axes/scale, or inappropriate chart type.

      Important context missing (units, variables, filters).

      Story unclear without written explanation.'
    points: 10.0
  - key: low-quality-with-major-issues
    description: Low Quality with Major Issues
    long_description: 'Chart does not show distribution or relationship meaningfully.

      Incomplete or incorrect encoding (e.g., scatterplot with categorical x‑axis).

      Uninterpretable without text.'
    points: 5.0
  - key: no-marks
    description: No Marks
    long_description: Graph is not included.
    points: 0.0
- key: design-principles-4
  description: Design Principles
  long_description: Make sure you are incorporating design principles and best practices for visualization design that were covered in lecture/reading
  points: 15.0
  use_range: true
  ratings:
  - key: professional-quality
    description: Professional Quality
    long_description: 'All three visuals apply at least two or more lecture‑based design principles each.

      Encoding choices fit the analytical frame.

      Color is purposeful; clutter minimized; scales honest; no 3D.

      Demonstrates understanding of perceptual rules (ordering, baseline, area/length use).

      Design strengthens communication without drawing attention to itself.'
    points: 15.0
  - key: high-quality-with-minor-issues
    description: High Quality with Minor Issues
    long_description: 'Most visuals use appropriate design principles but with small inconsistencies.

      Some choices could be more perceptually effective.

      Minor unnecessary chart elements remain.'
    points: 12.0
  - key: medium-quality-with-significant-issues
    description: Medium Quality with Significant Issues
    long_description: 'Design issues reduce clarity (e.g., misleading scales, unnecessary color, poor binning).

      Chart types sometimes misaligned with frame.

      Evidence of ignoring key perceptual principles from lecture.'
    points: 6.0
  - key: no-marks
    description: No Marks
    long_description: Graphs make it more difficult to understand analysis, no consideration for visual perception evident.
    points: 0.0
- key: summary-5
  description: Summary
  long_description: Write no more than 200 words synthesizing Visuals A, B, and C and comparing results with expectations. The same Word/PDF document must contain the three embedded visuals and their explanations; a summary alone is incomplete.
  points: 15.0
  use_range: true
  ratings:
  - key: professional-quality
    description: Professional Quality
    long_description: 'Synthesizes insights across A, B, C.

      Clearly states whether results matched expectations.

      Provides meaningful, non‑obvious insights.

      Connects directly to the charts and analytical frames.'
    points: 15.0
  - key: high-quality-with-minor-issues
    description: High Quality with Minor Issues
    long_description: 'Summary is accurate and relevant but less insightful or less connected.

      Some important insights implicit rather than explicit.'
    points: 12.0
  - key: medium-quality-with-significant-issues
    description: Medium Quality with Significant Issues
    long_description: 'Superficial or incomplete summary.

      Re-states graphs without interpretation.

      Missing insights or unclear connections.'
    points: 6.0
  - key: no-marks
    description: No Marks
    long_description: Summary not included in document.
    points: 0.0
- key: file-submission-6
  description: File Submission
  long_description: 'Submit one Word/PDF document containing dataset/scope notes, all three embedded visuals with 3-5 sentence explanations, summary, and AI reflection. Include the source files for the tools used: XLSX, TWBX, or R/Quarto source and needed images.'
  points: 5.0
  use_range: true
  ratings:
  - key: professional-quality
    description: Professional Quality
    long_description: The complete document contains all three readable visuals, explanations, summary, and AI reflection. Supporting files for the tools actually used are included and usable.
    points: 5.0
  - key: high-quality-with-minor-issues
    description: High Quality with Minor Issues
    long_description: All supporting materials are included. Files are in the correct file format but do not consistently follow best practices, e.g. tabs do not include descriptive labels, charts are not in separate tabs etc..
    points: 4.0
  - key: medium-quality-with-significant-issues
    description: Medium Quality with Significant Issues
    long_description: Supporting files are in the wrong format, not all relevant files are included.
    points: 2.5
  - key: low-quality-with-major-issues
    description: Low Quality with Major Issues
    long_description: Not all supporting files are included.
    points: 1.5
  - key: no-marks
    description: No Marks
    long_description: Supporting files are not included in submission.
    points: 0.0
- key: responsible-ai-reflection
  description: Responsible AI Reflection
  long_description: Write 4-6 sentences disclosing AI use or non-use. If used, name the tool, describe a specific use, include a prompt, evaluate a limitation, and explain verification. If not used, describe your own verification and distinguish appropriate AI support from a decision you would retain. AI use is not required for full credit.
  points: 5.0
  use_range: true
  ratings:
  - key: complete
    description: Complete and Specific
    long_description: Thoughtful disclosure and concrete verification; fully addresses the applicable AI-use or non-use path and keeps analytical decisions with the student.
    points: 5.0
  - key: mostly-complete
    description: Mostly Complete
    long_description: Addresses the applicable reflection path with a minor omission or thin explanation of verification.
    points: 4.0
  - key: partial
    description: Partially Complete
    long_description: Discloses use or non-use but gives limited specifics or little evaluation of verification and analytical responsibility.
    points: 3.0
  - key: minimal
    description: Minimal
    long_description: Only a generic statement with no meaningful reflection or checking example.
    points: 1.0
  - key: missing
    description: Not Included
    long_description: Required reflection is absent.
    points: 0.0
